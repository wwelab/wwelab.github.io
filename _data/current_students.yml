- name: "Yu Fang"
  email: "fangyu8200@163.com"
  description: |
    Yu Fang is a master’s student at the Faculty of Psychology, Southwest University. Her research interests focus on emotion concepts, emotion representation, and individual differences in emotional processing.
    She is particularly interested in using neuroimaging and computational approaches to investigate the cognitive and neural mechanisms underlying emotional representation across individuals and modalities.
